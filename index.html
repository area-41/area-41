<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área 41</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Faz o h2 e o h1 ficarem um embaixo do outro */
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h2 {
            font-size: 3vw;          /* Menor, para o "Welcome to" */
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888888;          /* Tom cinza para dar contraste */
            margin-bottom: 10px;
        }

        h1 {
            font-size: 12vw;         /* Gigante, para o "Área 41" */
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
        }
    </style>
</head>
<body>

    <h2>Welcome to</h2>
    <h1>Área 41</h1>

</body>
</html>
